# 服务端镜像：在原生 x86（ubuntu-24.04）和原生 ARM（ubuntu-24.04-arm）机器上分别构建，不用 QEMU，
# 再合并成 linux/amd64 + linux/arm64 的多架构镜像，推送到 ghcr.io/<owner>/moefrp-server。
#
# 标签：main 分支 → latest、main、sha-xxxxxxx；推送 v3.0.0 这样的 tag → 3.0.0、3.0、latest。
name: server-image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'server/**'
      - 'shared/**'
      - 'agent/**'
      - 'scripts/ci/**'
      - '.dockerignore'
      - '.github/workflows/server-image.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'shared/**'
      - 'agent/**'
      - 'scripts/ci/**'
      - '.github/workflows/server-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            agent/go.sum
      - name: shared
        working-directory: shared
        run: go vet ./... && go test -count=1 ./...
      - name: server
        working-directory: server
        run: go vet ./... && go test -count=1 -race ./...
      - name: agent
        working-directory: agent
        run: go vet ./... && go test -count=1 -race ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: prepare
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/moefrp-server" >> "$GITHUB_ENV"
          p='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${p//\//-}" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="main-${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "native arch: $(uname -m)"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 先在本机构建并试跑：绑定挂载目录的属主处理、降权、健康检查、管理后台页面。通过后才推送
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ env.VERSION }}
          load: true
          tags: moefrp-smoke
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
      - name: smoke test
        run: |
          set -euxo pipefail
          up() { # 名字 端口 docker-run 参数...
            local name=$1 port=$2; shift 2
            docker run -d --name "$name" -p "127.0.0.1:$port:8080" "$@" moefrp-smoke
            for _ in $(seq 30); do curl -fsS "http://127.0.0.1:$port/healthz" && echo && return 0; sleep 1; done
            docker logs "$name"; return 1
          }
          # 容器主进程的 uid（/proc/<pid>/status 的 Uid 行：real effective saved fs，四个都要是目标用户）
          runuid() { awk '/^Uid:/ {print $2; print $3; print $4; print $5}' "/proc/$(docker inspect -f '{{.State.Pid}}' "$1")/status" | sort -u; }

          # 1) ./data 不存在，由 Docker 以 root 创建：自动改属主，以 65532 运行
          up d1 18081 -v "$PWD/smoke1:/data"
          sudo ls -ln smoke1
          test "$(sudo stat -c %u:%g smoke1 smoke1/moefrp.db | sort -u)" = 65532:65532
          test "$(runuid d1)" = 65532
          docker logs d1 2>&1 | grep 初始化码 > /dev/null   # 不用 grep -q：提前退出会让 pipefail 误报
          curl -fsS http://127.0.0.1:18081/admin/ | grep app.js > /dev/null
          docker stop d1

          # 2) 已有数据、属于 root，指定 PUID/PGID 为当前用户：文件归当前用户
          sudo cp -a smoke1 smoke2 && sudo chown -R 0:0 smoke2
          up d2 18082 -v "$PWD/smoke2:/data" -e MOEFRP_PUID="$(id -u)" -e MOEFRP_PGID="$(id -g)"
          test "$(runuid d2)" = "$(id -u)"
          test "$(stat -c %u:%g smoke2/moefrp.db)" = "$(id -u):$(id -g)"
          docker exec d2 moefrp-server backup --to /data/backup.db
          test "$(stat -c %u smoke2/backup.db)" = "$(id -u)"
          docker rm -f d1 d2
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: agent smoke test
        run: |
          # 新版本放进目录挂给面板（agent_dist_dir），另编一个"旧版本"测试从旧版本升级
          mkdir -p "$RUNNER_TEMP/agent-dist"
          arch=$(go env GOARCH)
          (cd agent && CGO_ENABLED=0 go build -ldflags "-X main.version=ci-new" -o "$RUNNER_TEMP/agent-dist/moefrp-agent-linux-$arch" ./cmd/moefrp-agent)
          (cd agent && CGO_ENABLED=0 go build -ldflags "-X main.version=ci-old" -o "$RUNNER_TEMP/moefrp-agent-old" ./cmd/moefrp-agent)
          echo ci-new > "$RUNNER_TEMP/agent-dist/VERSION"
          chmod -R a+rX "$RUNNER_TEMP/agent-dist"
          bash scripts/ci/agent-smoke.sh moefrp-smoke "$RUNNER_TEMP/moefrp-agent-old" "$RUNNER_TEMP/agent-dist"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
      - name: export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: prepare
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/moefrp-server" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

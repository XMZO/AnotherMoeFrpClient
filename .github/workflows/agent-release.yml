# 节点 agent 发布：推送 agent-v1.2.3 这样的标签时，测试、编译 linux-amd64 / linux-arm64（Go 交叉编译），
# 在 GitHub Release 里发布程序和 SHA256SUMS。面板从这里取最新版本给节点安装和升级（docs/node-agent.md）。
#
#   git tag agent-v1.0.0 && git push origin agent-v1.0.0
#
# 发布不标记为 Latest：仓库的 releases/latest 留给客户端。
name: agent-release

on:
  push:
    tags: ['agent-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: version
        run: |
          v="${GITHUB_REF_NAME#agent-v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "标签应类似 agent-v1.2.3，实际是 $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: test
        working-directory: agent
        run: go vet ./... && go test -count=1 -race ./...
      - name: build
        working-directory: agent
        run: |
          mkdir -p ../dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o ../dist/moefrp-agent-linux-$arch ./cmd/moefrp-agent
          done
          test "$(../dist/moefrp-agent-linux-amd64 version)" = "$VERSION"
          cd ../dist && sha256sum moefrp-agent-linux-* > SHA256SUMS && cat SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="MoeFrp 节点 agent $VERSION（内嵌 frps）。

          不需要手动下载：在面板的“节点”页添加节点，复制安装命令到 VPS 上执行；已安装的节点在面板上点“升级”。

          校验和见 SHA256SUMS。"
          gh release create "$GITHUB_REF_NAME" dist/* --title "节点 agent $VERSION" --notes "$notes" --latest=false

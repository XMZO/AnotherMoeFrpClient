# MoeFrp 服务端单文件部署：moefrp-server + Caddy（自动申请 HTTPS 证书）。
# 需要 Docker Compose v2.23.1 及以上（用到 configs.content）。
#
#   1. 域名的 A/AAAA 记录指向这台服务器，开放 80 和 443 端口
#   2. 下载本文件，按需修改下面 moefrp_config 里的 [client] 部分
#   3. DOMAIN=frplus.example.com docker compose up -d
#      （或者在同目录写一个 .env：DOMAIN=frplus.example.com）
#
# 常用命令（镜像里没有 shell，直接执行程序）：
#   docker compose exec moefrp moefrp-server admin invite create -n 5
#   docker compose exec moefrp moefrp-server admin user list
#   docker compose exec moefrp moefrp-server backup --to /var/lib/moefrp/backup-$(date +%F).db
#   docker compose logs -f moefrp
#   docker compose pull && docker compose up -d      # 升级；有数据库迁移时会先自动备份
# 更多见 docs/docker.md。

name: moefrp

services:
  moefrp:
    image: ghcr.io/xmzo/moefrp-server:latest
    restart: unless-stopped
    configs:
      - source: moefrp_config
        target: /etc/moefrp/config.toml
    volumes:
      - moefrp-data:/var/lib/moefrp
    networks:
      - moefrp
    # 不对外暴露端口，只由 Caddy 访问。不用 Caddy 时可以改成 ports: ["127.0.0.1:8080:8080"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      moefrp:
        condition: service_healthy
    networks:
      - moefrp

networks:
  moefrp:
    ipam:
      config:
        # 固定网段：moefrp 只信任来自这里（Caddy）的 X-Forwarded-For，见 trusted_proxies
        - subnet: 172.29.0.0/24

volumes:
  moefrp-data:
  caddy-data:
  caddy-config:

configs:
  caddyfile:
    content: |
      ${DOMAIN:?请设置 DOMAIN，例如 DOMAIN=frplus.example.com docker compose up -d} {
        encode gzip
        reverse_proxy moefrp:8080
      }

  # moefrp-server 的配置（格式见 server/deploy/config.example.toml）。
  # listen 和 db_path 由镜像的环境变量决定，这里不用写。
  moefrp_config:
    content: |
      trusted_proxies = ["172.29.0.0/24"]
      single_session  = true
      session_ttl     = "720h"
      log_level       = "info"

      [client]
      latest_version = "3.0.0"
      min_version    = "3.0.0"
      download_url   = "https://github.com/XMZO/AnotherMoeFrpClient/releases/latest"
      sha256         = ""
      release_notes  = ""
      announcement   = ""

      # 图片面板的图源，可以有多个；不配置时客户端的图片面板显示"暂时没有可用的图源"
      [[client.image_sources]]
      url    = "https://umi.li/random?dir=lucky&type=img"
      weight = 5
      is_api = false
